<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سحب قرعة دوري قيد الأرض - مدرسة الإمام سيف بن سلطان</title>
    <!-- خط تجوال العربي -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
    <!-- مكتبة Canvas Confetti للمؤثرات الاحتفالية -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- إعدادات وقواعد Firebase للتزامن اللحظي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'qayd-earth-league-2026';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDemoKeyOnlyForLayoutAppTesting",
            authDomain: "demo-app.firebaseapp.com",
            projectId: "demo-app",
            storageBucket: "demo-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.db = db;
        window.doc = doc;
        window.setDoc = setDoc;
        window.onSnapshot = onSnapshot;
        window.appId = appId;

        // المصادقة الآمنة قبل استخدام المزامن اللحظي
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.log("Auth initialized / fallback active:", err.message);
            }
        }
        initAuth();

        // الاستماع للتحديثات اللحظية عبر جميع الأجهزة المتصلة
        onAuthStateChanged(auth, (user) => {
            if (!user) return;
            const drawDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'drawState', 'current');
            
            onSnapshot(drawDocRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    if (data && data.matches && data.drawnSlots) {
                        window.syncRemoteState(data);
                    }
                }
            }, (error) => {
                console.log("Realtime sync info:", error.message);
            });
        });

        // حفظ وسحب التغيرات في السحابة أونلاين
        window.saveStateToCloud = async function(stateData) {
            if (!auth.currentUser) return;
            try {
                const drawDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'drawState', 'current');
                await setDoc(drawDocRef, {
                    ...stateData,
                    updatedAt: new Date().toISOString(),
                    updatedBy: auth.currentUser.uid
                });
            } catch (err) {
                console.error("Cloud save notice:", err);
            }
        };
    </script>

    <style>
        :root {
            --gold-primary: #f5d061;
            --gold-gradient: linear-gradient(135deg, #ffe89a 0%, #d4af37 50%, #8a6d1c 100%);
            --gold-glow: 0 0 15px rgba(245, 208, 97, 0.6);
            --bg-dark: #07150e;
            --card-bg: rgba(12, 32, 22, 0.88);
            --border-gold: #d4af37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background: #000 url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(7, 21, 14, 0.78) 0%, rgba(3, 10, 7, 0.96) 100%);
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1350px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        header h1 {
            font-size: clamp(20px, 3.5vw, 28px);
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }

        header h2 {
            font-size: clamp(14px, 2.2vw, 19px);
            color: #e2e8f0;
            font-weight: 700;
            margin-top: 4px;
        }

        .online-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #4ade80;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 15px;
            margin-top: 8px;
            font-weight: 700;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* شبكة القرعة المتجاوبة */
        .draw-stage {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 20px;
            width: 100%;
            align-items: center;
            margin-top: 10px;
        }

        @media (max-width: 1080px) {
            .draw-stage {
                grid-template-columns: 1fr;
            }
            .matches-column {
                order: 2;
            }
            .wheel-center-container {
                order: 1;
                margin-bottom: 20px;
            }
        }

        .matches-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 10px 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .match-card.active {
            border-color: #fff;
            box-shadow: var(--gold-glow);
        }

        .match-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--gold-primary);
            margin-bottom: 6px;
        }

        .match-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .team-box {
            flex: 1;
            background: linear-gradient(180deg, #d4af37 0%, #8a6d1c 100%);
            border-radius: 8px;
            padding: 8px 4px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 13px;
            color: #000;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.4);
            transition: transform 0.4s ease, background 0.3s ease;
        }

        .team-box.empty {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed var(--border-gold);
            color: var(--gold-primary);
            font-size: 16px;
        }

        .vs-badge {
            font-size: 12px;
            font-weight: 900;
            color: #fff;
            background: rgba(212, 175, 55, 0.3);
            padding: 3px 6px;
            border-radius: 50%;
            border: 1px solid var(--border-gold);
        }

        .match-status {
            font-size: 11px;
            color: #cbd5e1;
            margin-top: 5px;
        }

        /* العجلة الدائرية المنتصف */
        .wheel-center-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 440px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 480px) {
            .wheel-center-container {
                max-width: 330px;
                height: 330px;
            }
        }

        .wheel-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed rgba(212, 175, 55, 0.4);
            animation: rotateBg 60s linear infinite;
        }

        @keyframes rotateBg {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .center-ball {
            position: absolute;
            width: 110px;
            height: 110px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #d4af37 60%, #4a3b0f 100%);
            border-radius: 50%;
            box-shadow: var(--gold-glow), inset -5px -5px 20px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            z-index: 2;
            border: 3px solid #fff;
        }

        @media (max-width: 480px) {
            .center-ball {
                width: 80px;
                height: 80px;
                font-size: 32px;
            }
        }

        .wheel-cards {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 3;
        }

        .wheel-card-slot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 64px;
            margin-top: -32px;
            margin-left: -25px;
            perspective: 1000px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        @media (max-width: 480px) {
            .wheel-card-slot {
                width: 38px;
                height: 50px;
                margin-top: -25px;
                margin-left: -19px;
            }
        }

        .wheel-card-slot:hover {
            scale: 1.15;
            z-index: 10;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            background: var(--gold-gradient);
            border-radius: 8px;
            border: 1px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 900;
            color: #000;
            position: relative;
            transition: all 0.5s ease;
        }

        .wheel-card-slot.drawn .card-inner {
            background: #1e293b;
            border-color: #475569;
            color: #64748b;
            opacity: 0.6;
        }

        .wheel-card-slot.drawn::after {
            content: '✔';
            position: absolute;
            top: -4px;
            right: -4px;
            background: #22c55e;
            color: #fff;
            font-size: 11px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            box-shadow: 0 0 5px #22c55e;
        }

        /* أزرار التحكم */
        .controls-bar {
            margin-top: 25px;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-draw {
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            color: #fff;
            border: 2px solid #86efac;
            padding: 12px 26px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-draw:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.7);
        }

        .btn-print {
            background: linear-gradient(135deg, #d4af37 0%, #8a6d1c 100%);
            color: #000;
            border: 1px solid #fff;
            padding: 10px 22px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-print:hover {
            background: #fff;
            color: #000;
        }

        .btn-reset {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid #ef4444;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-reset:hover {
            background: #ef4444;
            color: #fff;
        }

        /* النافذة المنبثقة للاحتفال الكاشفة */
        .reveal-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(10px);
        }

        .reveal-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .reveal-card {
            background: var(--gold-gradient);
            padding: 30px 45px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 50px rgba(245, 208, 97, 0.8);
            border: 3px solid #fff;
            transform: scale(0.5) rotate(-10deg);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #000;
        }

        .reveal-modal.active .reveal-card {
            transform: scale(1) rotate(0deg);
        }

        .reveal-card h3 {
            font-size: 18px;
            font-weight: 700;
            opacity: 0.85;
        }

        .reveal-card .team-name {
            font-size: clamp(28px, 6vw, 42px);
            font-weight: 900;
            margin: 15px 0;
            text-shadow: 0 2px 4px rgba(255,255,255,0.5);
        }

        .reveal-card .dest-text {
            font-size: 16px;
            font-weight: 800;
            background: rgba(0,0,0,0.15);
            padding: 6px 16px;
            border-radius: 15px;
        }

        /* إعدادات وتنسيقات الطباعة الأنيقة A4 */
        @media print {
            body {
                background: #fff !important;
                color: #000 !important;
            }
            body::before, .wheel-center-container, .controls-bar, .reveal-modal, .online-badge {
                display: none !important;
            }
            .app-container {
                max-width: 100% !important;
                padding: 0 !important;
            }
            header h1 {
                -webkit-text-fill-color: #000 !important;
                font-size: 20pt !important;
            }
            header h2 {
                color: #333 !important;
                font-size: 14pt !important;
            }
            .draw-stage {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                gap: 15px !important;
                margin-top: 20px !important;
            }
            .match-card {
                background: #fff !important;
                border: 2px solid #000 !important;
                box-shadow: none !important;
                color: #000 !important;
                page-break-inside: avoid;
            }
            .match-title {
                color: #000 !important;
                font-size: 12pt !important;
            }
            .team-box {
                background: #f1f5f9 !important;
                color: #000 !important;
                border: 1px solid #000 !important;
                box-shadow: none !important;
            }
            .team-box.empty {
                background: #fff !important;
                color: #888 !important;
            }
            .vs-badge {
                background: #e2e8f0 !important;
                color: #000 !important;
                border: 1px solid #000 !important;
            }
            .match-status {
                color: #555 !important;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- الهيدر -->
        <header>
            <h1>سحب قرعة دوري قيد الأرض لكرة القدم للعام الدراسي 2026/2027م</h1>
            <h2>مدرسة الإمام سيف بن سلطان (11-12)</h2>
            <div class="online-badge">
                <span class="online-dot"></span>
                <span>متصل أونلاين والمزامنة مفعّلة عبر الأجهزة</span>
            </div>
        </header>

        <!-- مسرح القرعة -->
        <div class="draw-stage">
            <!-- المباريات اليسرى (5 - 8) -->
            <div class="matches-column" id="left-matches"></div>

            <!-- عجلة القرعة المركزية -->
            <div class="wheel-center-container">
                <div class="wheel-ring"></div>
                <div class="center-ball">⚽</div>
                <div class="wheel-cards" id="wheel-cards-container"></div>
            </div>

            <!-- المباريات اليمنى (1 - 4) -->
            <div class="matches-column" id="right-matches"></div>
        </div>

        <!-- أزرار التحكم -->
        <div class="controls-bar">
            <button class="btn-draw" onclick="drawRandomCard()">
                <span>🎲</span> ابدأ السحب بالضغط على أحد المربعات الذهبية
            </button>

            <button class="btn-print" onclick="window.print()">
                <span>🖨️</span> طباعة القرعة / PDF
            </button>

            <button class="btn-reset" onclick="resetDraw()">إعادة القرعة 🔄</button>
        </div>
    </div>

    <!-- نافذة الكشف عن الفريق -->
    <div class="reveal-modal" id="reveal-modal">
        <div class="reveal-card">
            <h3>تم سحب الفريق</h3>
            <div class="team-name" id="modal-team-name">فريق 10/1</div>
            <div class="dest-text" id="modal-dest-text">يتجه إلى مباراة 1</div>
        </div>
    </div>

    <script>
        // قائمة الـ 16 فريق بالاسم المحدد الجديد (فريق بدل Seeff / STAEEF)
        const teamsList = [
            "فريق 11/1", "فريق 11/2", "فريق 11/3", "فريق 11/4",
            "فريق 11/5", "فريق 11/6", "فريق 11/7", "فريق 11/8",
            "فريق 12/1", "فريق 12/2", "فريق 12/3", "فريق 12/4",
            "فريق 12/5", "فريق 12/6", "فريق 12/7", "فريق 12/8"
        ];

        // الحالة المحلية للقرعة
        let availableTeams = [...teamsList];
        let matches = Array.from({ length: 8 }, (_, i) => ({
            id: i + 1,
            team1: null,
            team2: null
        }));
        let drawnSlots = new Array(16).fill(false);

        // الصوتيات البرمجية
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'tick') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'reveal') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        // استقبال وتدفق المزامن من السحابة لجميع الأجهزة
        window.syncRemoteState = function(remoteData) {
            if (remoteData.matches) matches = remoteData.matches;
            if (remoteData.drawnSlots) drawnSlots = remoteData.drawnSlots;
            if (remoteData.availableTeams) availableTeams = remoteData.availableTeams;

            renderMatches();
            renderWheel();
        };

        // عرض بطاقات المباريات
        function renderMatches() {
            const leftCol = document.getElementById('left-matches');
            const rightCol = document.getElementById('right-matches');
            leftCol.innerHTML = '';
            rightCol.innerHTML = '';

            matches.forEach((m, idx) => {
                const card = document.createElement('div');
                card.className = `match-card ${(!m.team1 || !m.team2) && (m.team1 || m.team2) ? 'active' : ''}`;
                
                const statusText = !m.team1 && !m.team2 ? 'في انتظار السحب...' : 
                                   (m.team1 && m.team2 ? 'مكتملة ✅' : 'في انتظار الطرف الثاني...');

                card.innerHTML = `
                    <div class="match-title">مباراة ${m.id}</div>
                    <div class="match-teams">
                        <div class="team-box ${!m.team1 ? 'empty' : ''}">${m.team1 || '?'}</div>
                        <div class="vs-badge">ضد</div>
                        <div class="team-box ${!m.team2 ? 'empty' : ''}">${m.team2 || '?'}</div>
                    </div>
                    <div class="match-status">${statusText}</div>
                `;

                if (idx < 4) {
                    rightCol.appendChild(card);
                } else {
                    leftCol.appendChild(card);
                }
            });
        }

        // عرض العجلة الدائرية المكونة من 16 بطاقة
        function renderWheel() {
            const container = document.getElementById('wheel-cards-container');
            container.innerHTML = '';
            
            const isSmallScreen = window.innerWidth <= 480;
            const radius = isSmallScreen ? 125 : 165; 
            const total = 16;

            for (let i = 0; i < total; i++) {
                const angle = (i * (360 / total)) * (Math.PI / 180);
                const x = radius * Math.cos(angle);
                const y = radius * Math.sin(angle);

                const slot = document.createElement('div');
                slot.className = `wheel-card-slot ${drawnSlots[i] ? 'drawn' : ''}`;
                slot.style.transform = `translate(${x}px, ${y}px)`;
                slot.onclick = () => handleCardClick(i);

                slot.innerHTML = `
                    <div class="card-inner">؟</div>
                `;
                container.appendChild(slot);
            }
        }

        // عند اختيار بطاقة
        function handleCardClick(slotIndex) {
            if (drawnSlots[slotIndex] || availableTeams.length === 0) return;

            const randomTeamIndex = Math.floor(Math.random() * availableTeams.length);
            const selectedTeam = availableTeams.splice(randomTeamIndex, 1)[0];
            drawnSlots[slotIndex] = true;

            let targetMatch = matches.find(m => !m.team1 || !m.team2);
            let slotPosition = '';
            if (targetMatch) {
                if (!targetMatch.team1) {
                    targetMatch.team1 = selectedTeam;
                    slotPosition = 'طرف أول';
                } else {
                    targetMatch.team2 = selectedTeam;
                    slotPosition = 'طرف ثاني';
                }
            }

            playSound('reveal');
            renderWheel();

            showRevealModal(selectedTeam, `مباراة ${targetMatch.id} (${slotPosition})`);

            // حفظ الحالة اللحظية للربط أونلاين لجميع الأجهزة
            if (window.saveStateToCloud) {
                window.saveStateToCloud({
                    matches,
                    drawnSlots,
                    availableTeams
                });
            }

            setTimeout(() => {
                renderMatches();
                if (targetMatch.team1 && targetMatch.team2) {
                    confetti({ particleCount: 85, spread: 65, origin: { y: 0.6 } });
                }
            }, 600);
        }

        // سحب بطاقة عشوائية
        function drawRandomCard() {
            const undrawnIndices = drawnSlots.map((drawn, idx) => drawn ? null : idx).filter(v => v !== null);
            if (undrawnIndices.length === 0) return;
            const randomIndex = undrawnIndices[Math.floor(Math.random() * undrawnIndices.length)];
            handleCardClick(randomIndex);
        }

        // الكشف عن الفريق
        function showRevealModal(teamName, destText) {
            const modal = document.getElementById('reveal-modal');
            document.getElementById('modal-team-name').innerText = teamName;
            document.getElementById('modal-dest-text').innerText = `يتجه إلى ${destText}`;
            modal.classList.add('active');

            setTimeout(() => {
                modal.classList.remove('active');
            }, 1800);
        }

        // إعادة القرعة
        function resetDraw() {
            availableTeams = [...teamsList];
            matches = Array.from({ length: 8 }, (_, i) => ({ id: i + 1, team1: null, team2: null }));
            drawnSlots = new Array(16).fill(false);
            
            renderMatches();
            renderWheel();

            if (window.saveStateToCloud) {
                window.saveStateToCloud({
                    matches,
                    drawnSlots,
                    availableTeams
                });
            }
        }

        // ضبط الحجم عند تغيير حجم الشاشة
        window.addEventListener('resize', renderWheel);

        // بدء التشغيل
        renderMatches();
        renderWheel();
    </script>
</body>
</html>
