<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سحب قرعة دوري قيد الأرض - مدرسة الإمام سيف بن سلطان</title>
    <!-- خط تجوال العربي -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
    <!-- مكتبة Canvas Confetti للمؤثرات الاحتفالية -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --gold-primary: #f5d061;
            --gold-gradient: linear-gradient(135deg, #ffe89a 0%, #d4af37 50%, #8a6d1c 100%);
            --gold-glow: 0 0 15px rgba(245, 208, 97, 0.6);
            --bg-dark: #07150e;
            --card-bg: rgba(12, 32, 22, 0.85);
            --border-gold: #d4af37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background: #000 url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* الطبقة المعتمة للملعب */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(7, 21, 14, 0.75) 0%, rgba(3, 10, 7, 0.95) 100%);
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1300px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* الهيدر والعناوين */
        header {
            text-align: center;
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 26px;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }

        header h2 {
            font-size: 18px;
            color: #e2e8f0;
            font-weight: 700;
            margin-top: 2px;
        }

        /* شبكة القرعة الرئيسية */
        .draw-stage {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            gap: 20px;
            width: 100%;
            align-items: center;
            margin-top: 10px;
        }

        @media (max-width: 1024px) {
            .draw-stage {
                grid-template-columns: 1fr;
            }
        }

        /* قائمة المباريات الجانبية */
        .matches-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 8px 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .match-card.active {
            border-color: #fff;
            box-shadow: var(--gold-glow);
        }

        .match-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--gold-primary);
            margin-bottom: 6px;
        }

        .match-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .team-box {
            flex: 1;
            background: linear-gradient(180deg, #d4af37 0%, #8a6d1c 100%);
            border-radius: 8px;
            padding: 8px 4px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 13px;
            color: #000;
            box-shadow: inset 0 0 5px rgba(255,255,255
