<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دوري قيد الأرض 2026-2027 - مدرسة الإمام سيف بن سلطان</title>
    <!-- خط تجوال العربي -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
    <!-- مكتبة المؤثرات الاحتفالية -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --gold-primary: #f5d061;
            --gold-gradient: linear-gradient(135deg, #ffe89a 0%, #d4af37 50%, #8a6d1c 100%);
            --gold-glow: 0 0 20px rgba(245, 208, 97, 0.6);
            --bg-dark: #05120a;
            --card-bg: rgba(10, 28, 18, 0.92);
            --border-gold: #d4af37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background: #000 url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(5, 18, 10, 0.8) 0%, rgba(2, 8, 4, 0.97) 100%);
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1350px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* الهيدر وأزرار الخدمات */
        header {
            text-align: center;
            margin-bottom: 12px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .header-titles h1 {
            font-size: 26px;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .header-titles h2 {
            font-size: 18px;
            color: #e2e8f0;
            font-weight: 700;
        }

        .top-actions {
            display: flex;
            gap: 12px;
        }

        .btn-action {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--border-gold);
            color: var(--gold-primary);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-action:hover {
            background: var(--gold-primary);
            color: #000;
            box-shadow: var(--gold-glow);
        }

        /* مسرح القرعة */
        .draw-stage {
            display: grid;
            grid-template-columns: 290px 1fr 290px;
            gap: 15px;
            width: 100%;
            align-items: center;
            margin-top: 5px;
        }

        @media (max-width: 1024px) {
            .draw-stage {
                grid-template-columns: 1fr;
            }
        }

        .matches-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 10px;
            padding: 8px 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            backdrop-filter: blur(8px);
        }

        .match-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--gold-primary);
            margin-bottom: 4px;
        }

        .match-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
        }

        .team-box {
            flex: 1;
            background: linear-gradient(180deg, #ffe89a 0%, #d4af37 50%, #8a6d1c 100%);
            border-radius: 6px;
            padding: 6px 2px;
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 13px;
            color: #000;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.4);
        }

        .team-box.empty {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed var(--border-gold);
            color: var(--gold-primary);
            font-size: 14px;
        }

        .vs-badge {
            font-size: 11px;
            font-weight: 900;
            color: #fff;
            background: rgba(212, 175, 55, 0.3);
            padding: 2px 5px;
            border-radius: 50%;
            border: 1px solid var(--border-gold);
        }

        .match-status {
            font-size: 10px;
            color: #cbd5e1;
            margin-top: 4px;
        }

        /* العجلة الدائرية وكرة كأس العالم 2022 */
        .wheel-center-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 440px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed rgba(212, 175, 55, 0.4);
            animation: rotateBg 60s linear infinite;
        }

        @keyframes rotateBg {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* تصميم كرة الرحلة - كأس العالم قطر 2022 */
        .center-ball-alrihla {
            position: absolute;
            width: 125px;
            height: 125px;
            border-radius: 50%;
            box-shadow: var(--gold-glow), inset -6px -6px 20px rgba(0,0,0,0.8);
            z-index: 2;
            border: 3px solid #fff;
            overflow: hidden;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e2e8f0 70%, #94a3b8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .alrihla-svg {
            width: 100%;
            height: 100%;
        }

        /* البطاقات الذهبية على العجلة */
        .wheel-cards {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 3;
        }

        .wheel-card-slot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 52px;
            height: 66px;
            margin-top: -33px;
            margin-left: -26px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .wheel-card-slot:hover {
            scale: 1.15;
            z-index: 10;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            background: var(--gold-gradient);
            border-radius: 8px;
            border: 1px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 900;
            color: #000;
            position: relative;
        }

        .wheel-card-slot.drawn .card-inner {
            background: #1e293b;
            border-color: #475569;
            color: #64748b;
            opacity: 0.5;
        }

        .wheel-card-slot.drawn::after {
            content: '✔';
            position: absolute;
            top: -4px;
            right: -4px;
            background: #22c55e;
            color: #fff;
            font-size: 10px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            box-shadow: 0 0 5px #22c55e;
        }

        /* شريط التحكم السفلي */
        .controls-bar {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-draw {
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            color: #fff;
            border: 2px solid #86efac;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-draw:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.7);
        }

        .btn-reset {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid #ef4444;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-reset:hover {
            background: #ef4444;
            color: #fff;
        }

        /* نافذة الكشف منبثقة */
        .reveal-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .reveal-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .reveal-card {
            background: var(--gold-gradient);
            padding: 25px 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 0 40px rgba(245, 208, 97, 0.8);
            border: 2px solid #fff;
            transform: scale(0.6);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #000;
        }

        .reveal-modal.active .reveal-card {
            transform: scale(1);
        }

        .reveal-card .team-name {
            font-size: 34px;
            font-weight: 900;
            margin: 10px 0;
        }

        .reveal-card .dest-text {
            font-size: 15px;
            font-weight: 800;
            background: rgba(0,0,0,0.15);
            padding: 5px 12px;
            border-radius: 12px;
        }

        /* طباعة رسمية */
        @media print {
            body {
                background: #fff !important;
                color: #000 !important;
            }
            body::before, .wheel-center-container, .controls-bar, .top-actions {
                display: none !important;
            }
            .match-card {
                background: #fff !important;
                border: 1px solid #000 !important;
                box-shadow: none !important;
                color: #000 !important;
                page-break-inside: avoid;
            }
            .match-title, .match-status {
                color: #000 !important;
            }
            .team-box {
                background: #eee !important;
                color: #000 !important;
                border: 1px solid #000 !important;
            }
            .draw-stage {
                grid-template-columns: 1fr 1fr !important;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- الهيدر والخدمات -->
        <header>
            <div class="header-titles">
                <h1>سحب قرعة دوري قيد الأرض لكرة القدم للعام الدراسي 2026/2027م</h1>
                <h2>مدرسة الإمام سيف بن سلطان (11-12)</h2>
            </div>
            <div class="top-actions">
                <button class="btn-action" onclick="window.print()">🖨️ طباعة / تصدير PDF</button>
            </div>
        </header>

        <!-- مسرح القرعة والعجلة -->
        <div class="draw-stage">
            <div class="matches-column" id="left-matches"></div>

            <div class="wheel-center-container">
                <div class="wheel-ring"></div>
                
                <!-- تصميم كرة الرحلة - كأس العالم قطر 2022 -->
                <div class="center-ball-alrihla">
                    <svg class="alrihla-svg" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="48" fill="#f8fafc" stroke="#cbd5e1" stroke
