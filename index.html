    <title>دوري قيد الأرض 2026-2027 - مدرسة الإمام سيف بن سلطان</title>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold-primary: #f5d061;
            --gold-gradient: linear-gradient(135deg, #ffe89a 0%, #d4af37 50%, #8a6d1c 100%);
            --gold-glow: 0 0 20px rgba(245, 208, 97, 0.6);
            --bg-dark: #05120a;
            --card-bg: rgba(10, 28, 18, 0.95);
            --border-gold: #d4af37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background: #030c07 url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(5, 18, 10, 0.85) 0%, rgba(2, 8, 4, 0.98) 100%);
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1350px;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 5px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .header-titles h1 {
            font-size: 22px;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .header-titles h2 {
            font-size: 15px;
            color: #e2e8f0;
            font-weight: 700;
        }

        .top-actions {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--border-gold);
            color: var(--gold-primary);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-action:hover {
            background: var(--gold-primary);
            color: #000;
            box-shadow: var(--gold-glow);
        }

        /* مسرح القرعة */
        .draw-stage {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            gap: 10px;
            width: 100%;
            align-items: center;
        }

        @media (max-width: 1024px) {
            .draw-stage {
                grid-template-columns: 1fr;
            }
        }

        .matches-column {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 8px;
            padding: 6px 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            backdrop-filter: blur(8px);
        }

        .match-title {
            font-size: 12px;
            font-weight: 800;
            color: var(--gold-primary);
            margin-bottom: 2px;
        }

        .match-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
        }

        .team-box {
            flex: 1;
            background: linear-gradient(180deg, #ffe89a 0%, #d4af37 50%, #8a6d1c 100%);
            border-radius: 5px;
            padding: 5px 2px;
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 12px;
            color: #000;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.4);
        }

        .team-box.empty {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed var(--border-gold);
            color: var(--gold-primary);
            font-size: 13px;
        }

        .vs-badge {
            font-size: 10px;
            font-weight: 900;
            color: #fff;
            background: rgba(212, 175, 55, 0.3);
            padding: 2px 4px;
            border-radius: 50%;
            border: 1px solid var(--border-gold);
        }

        .match-status {
            font-size: 10px;
            color: #cbd5e1;
            margin-top: 2px;
        }

        /* العجلة الدائرية والكرة 3D */
        .wheel-center-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 420px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed rgba(212, 175, 55, 0.4);
            animation: rotateBg 60s linear infinite;
        }

        @keyframes rotateBg {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* حاوية الكرة ثلاثية الأبعاد 3D */
        #ball-3d-container {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            z-index: 2;
            cursor: pointer;
            box-shadow: var(--gold-glow);
        }

        .wheel-cards {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 3;
        }

        .wheel-card-slot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 48px;
            height: 60px;
            margin-top: -30px;
            margin-left: -24px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .wheel-card-slot:hover {
            scale: 1.15;
            z-index: 10;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            background: var(--gold-gradient);
            border-radius: 6px;
            border: 1px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 900;
            color: #000;
            position: relative;
        }

        .wheel-card-slot.drawn .card-inner {
            background: #1e293b;
            border-color: #475569;
            color: #64748b;
            opacity: 0.5;
        }

        .wheel-card-slot.drawn::after {
            content: '✔';
            position: absolute;
            top: -4px;
            right: -4px;
            background: #22c55e;
            color: #fff;
            font-size: 9px;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .controls-bar {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-draw {
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            color: #fff;
            border: 2px solid #86efac;
            padding: 8px 22px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 3
