<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دوري قيد الأرض 2026-2027 - مدرسة الإمام سيف بن سلطان</title>
    <!-- خط تجوال العربي -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
    <!-- مكتبة Three.js ثلاثية الأبعاد -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- مكتبة الألعاب النارية -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --gold-primary: #f5d061;
            --gold-gradient: linear-gradient(135deg, #ffe89a 0%, #d4af37 50%, #8a6d1c 100%);
            --gold-glow: 0 0 20px rgba(245, 208, 97, 0.6);
            --bg-dark: #030c07;
            --card-bg: rgba(10, 28, 18, 0.95);
            --border-gold: #d4af37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background: #030c07 url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(5, 18, 10, 0.85) 0%, rgba(2, 8, 4, 0.98) 100%);
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1400px;
            padding: clamp(8px, 2vw, 15px);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 92vh;
            justify-content: space-between;
        }

        header {
            text-align: center;
            margin-bottom: clamp(5px, 1.5vw, 12px);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .header-titles h1 {
            font-size: clamp(16px, 2.2vw, 26px);
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            line-height: 1.3;
        }

        .header-titles h2 {
            font-size: clamp(12px, 1.4vw, 17px);
            color: #e2e8f0;
            font-weight: 700;
        }

        .top-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        .btn-action {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--border-gold);
            color: var(--gold-primary);
            padding: clamp(4px, 1vw, 7px) clamp(10px, 2vw, 18px);
            border-radius: 20px;
            font-size: clamp(11px, 1.1vw, 13px);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            background: var(--gold-primary);
            color: #000;
            box-shadow: var(--gold-glow);
        }

        /* مسرح القرعة التكيفي لكافة الأجهزة */
        .draw-stage {
            display: grid;
            grid-template-columns: minmax(240px, 300px) 1fr minmax(240px, 300px);
            gap: clamp(8px, 1.5vw, 15px);
            width: 100%;
            align-items: center;
            margin: 5px 0;
        }

        @media (max-width: 900px) {
            .draw-stage {
                grid-template-columns: 1fr;
            }
        }

        .matches-column {
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1vw, 10px);
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 8px;
            padding: clamp(5px, 1vw, 8px) clamp(8px, 1.2vw, 12px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            backdrop-filter: blur(8px);
        }

        .match-title {
            font-size: clamp(11px, 1.1vw, 13px);
            font-weight: 800;
            color: var(--gold-primary);
            margin-bottom: 3px;
        }

        .match-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
        }

        .team-box {
            flex: 1;
            background: linear-gradient(180deg, #ffe89a 0%, #d4af37 50%, #8a6d1c 100%);
            border-radius: 5px;
            padding: clamp(4px, 0.8vw, 6px) 2px;
            min-height: clamp(32px, 3.5vw, 40px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: clamp(11px, 1.1vw, 13px);
            color: #000;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.4);
        }

        .team-box.empty {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed var(--border-gold);
            color: var(--gold-primary);
            font-size: clamp(12px, 1.2vw, 14px);
        }

        .vs-badge {
            font-size: clamp(9px, 0.9vw, 11px);
            font-weight: 900;
            color: #fff;
            background: rgba(212, 175, 55, 0.3);
            padding: 2px 4px;
            border-radius: 50%;
            border: 1px solid var(--border-gold);
        }

        .match-status {
            font-size: clamp(9px, 0.8vw, 10px);
            color: #cbd5e1;
            margin-top: 2px;
        }

        /* العجلة الدائرية التفاعلية المرنة */
        .wheel-center-container {
            position: relative;
            width: clamp(280px, 35vw, 420px);
            height: clamp(280px, 35vw, 420px);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed rgba(212, 175, 55, 0.4);
            animation: rotateBg 60s linear infinite;
        }

        @keyframes rotateBg {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        #ball-3d-container {
            position: absolute;
            width: clamp(90px, 11vw, 135px);
            height: clamp(90px, 11vw, 135px);
            border-radius: 50%;
            z-index: 2;
            cursor: pointer;
            box-shadow: var(--gold-glow);
        }

        .wheel-cards {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 3;
        }

        .wheel-card-slot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: clamp(34px, 4vw, 46px);
            height: clamp(44px, 5.2vw, 60px);
            margin-top: calc(-1 * clamp(22px, 2.6vw, 30px));
            margin-left: calc(-1 * clamp(17px, 2vw, 23px));
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .wheel-card-slot:hover {
            scale: 1.15;
            z-index: 10;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            background: var(--gold-gradient);
            border-radius: 6px;
            border: 1px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(13px, 1.5vw, 18px);
            font-weight: 900;
            color: #000;
        }

        .wheel-card-slot.drawn .card-inner {
            background: #1e293b;
            border-color: #475569;
            color: #64748b;
            opacity: 0.5;
        }

        .wheel-card-slot.drawn::after {
            content: '✔';
            position: absolute;
            top: -4px;
            right: -4px;
            background: #22c55e;
            color: #fff;
            font-size: 9px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .controls-bar {
            margin-top: clamp(8px, 1.5vw, 15px);
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-draw {
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            color: #fff;
            border: 2px solid #86efac;
            padding: clamp(6px, 1vw, 10px) clamp(16px, 2vw, 26px);
            font-size: clamp(13px, 1.2vw, 16px);
            font-weight: 800;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
            transition: all 0.3s ease;
        }

        .btn-draw:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.7);
        }

        .btn-reset {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid #ef4444;
            padding: clamp(5px, 0.8vw, 8px) clamp(12px, 1.5vw, 18px);
            font-size: clamp(11px, 1vw, 13px);
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
        }

        .btn-reset:hover {
            background: #ef4444;
            color: #fff;
        }

        /* نافذة الكشف منبثقة */
        .reveal-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .reveal-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .reveal-card {
            background: var(--gold-gradient);
            padding: clamp(20px, 3vw, 30px) clamp(25px, 4vw, 50px);
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 0 40px rgba(245, 208, 97, 0.8);
            border: 2px solid #fff;
            transform: scale(0.6);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #000;
        }

        .reveal-modal.active .reveal-card {
            transform: scale(1);
        }

        .reveal-card .team-name {
            font-size: clamp(24px, 3.5vw, 36px);
            font-weight: 900;
            margin: 8px 0;
        }

        .reveal-card .dest-text {
            font-size: clamp(12px, 1.3vw, 16px);
            font-weight: 800;
            background: rgba(0,0,0,0.15);
            padding: 4px 12px;
            border-radius: 10px;
        }

        /* التوقيع وشعار الشركة المطورة AITECHOM */
        footer.developer-footer {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 10px 0;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            margin-top: 10px;
        }

        .footer-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: clamp(11px, 1.1vw, 13px);
            color: #cbd5e1;
            font-weight: 700;
        }

        .brand-logo-text {
            background: linear-gradient(135deg, #22d3ee 0%, #3b82f6 50%, #f5d061 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            font-size: clamp(13px, 1.3vw, 16px);
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.3);
        }

        @media print {
            body { background: #fff !important; color: #000 !important; }
            body::before, .wheel-center-container, .controls-bar, .top-actions, footer.developer-footer { display: none !important; }
            .match-card { background: #fff !important; border: 1px solid #000 !important; box-shadow: none !important; color: #000 !important; }
            .match-title, .match-status { color: #000 !important; }
            .team-box { background: #eee !important; color: #000 !important; border: 1px solid #000 !important; }
            .draw-stage { grid-template-columns: 1fr 1fr !important; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="header-titles">
                <h1>سحب قرعة دوري قيد الأرض لكرة القدم للعام الدراسي 2026/2027م</h1>
                <h2>مدرسة الإمام سيف بن سلطان (11-12)</h2>
            </div>
            <div class="top-actions">
                <button class="btn-action" onclick="window.print()">🖨️ طباعة / تصدير PDF</button>
            </div>
        </header>

        <div class="draw-stage">
            <div class="matches-column" id="left-matches"></div>

            <div class="wheel-center-container">
                <div class="wheel-ring"></div>
                
                <!-- حاوية كرة القدم ثلاثية الأبعاد 3D (مونديال قطر 2022) -->
                <div id="ball-3d-container"></div>

                <div class="wheel-cards" id="wheel-cards-container"></div>
            </div>

            <div class="matches-column" id="right-matches"></div>
        </div>

        <div class="controls-bar">
            <button class="btn-draw" onclick="drawRandomCard()">
                🎲 ابدأ السحب بالضغط على أحد المربعات الذهبية
            </button>
            <button class="btn-reset" onclick="resetDraw()">إعادة القرعة 🔄</button>
        </div>
    </div>

    <!-- توقيع الشركة المصممة AITECHOM -->
    <footer class="developer-footer">
        <div class="footer-content">
            <span>تم التصميم والتطوير بواسطة</span>
            <span class="brand-logo-text">AITECHOM</span>
        </div>
    </footer>

    <div class="reveal-modal" id="reveal-modal">
        <div class="reveal-card">
            <h3>تم سحب الفريق</h3>
            <div class="team-name" id="modal-team-name">فريق 11/1</div>
            <div class="dest-text" id="modal-dest-text">يتجه إلى مباراة 1</div>
        </div>
    </div>

    <script>
        const DB_URL = "https://qayd-draw-default-rtdb.firebaseio.com/qayd_draw_2026.json";

        const INITIAL_TEAMS = [
            "فريق 11/1", "فريق 11/2", "فريق 11/3", "فريق 11/4",
            "فريق 11/5", "فريق 11/6", "فريق 11/7", "فريق 11/8",
            "فريق 12/1", "فريق 12/2", "فريق 12/3", "فريق 12/4",
            "فريق 12/5", "فريق 12/6", "فريق 12/7", "فريق 12/8"
        ];

        let state = loadState();

        function loadState() {
            const saved = localStorage.getItem('qayd_draw_state_2026');
            if (saved) {
                try { return JSON.parse(saved); } catch (e) {}
            }
            return {
                matches: Array.from({ length: 8 }, (_, i) => ({ id: i + 1, team1: null, team2: null })),
                drawnSlots: new Array(16).fill(false),
                availableTeams: [...INITIAL_TEAMS]
            };
        }

        async function saveState(newState) {
            state = newState;
            localStorage.setItem('qayd_draw_state_2026', JSON.stringify(state));
            renderApp();
            
            try {
                await fetch(DB_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(state)
                });
            } catch (e) {}
        }

        async function fetchCloudState() {
            try {
                const res = await fetch(DB_URL);
                const data = await res.json();
                if (data && data.matches && data.availableTeams) {
                    state = data;
                    localStorage.setItem('qayd_draw_state_2026', JSON.stringify(state));
                    renderApp();
                }
            } catch (e) {}
        }

        // --- كرة القدم ثلاثية الأبعاد 3D (تصميم الرحلة - قطر 2022) ---
        let scene, camera, renderer, ballMesh;

        function init3DBall() {
            const container = document.getElementById('ball-3d-container');
            if (!container) return;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
            camera.position.z = 2.8;

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            
            function updateBallSize() {
                const width = container.clientWidth || 120;
                renderer.setSize(width, width);
            }
            updateBallSize();
            container.appendChild(renderer.domElement);

            window.addEventListener('resize', updateBallSize);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfffaed, 1.4);
            dirLight.position.set(3, 3, 3);
            scene.add(dirLight);

            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, 1024, 1024);

            ctx.fillStyle = '#0f172a';
            for (let i = 0; i < 12; i++) {
                let x = Math.random() * 1024;
                let y = Math.random() * 1024;
                ctx.beginPath();
                ctx.arc(x, y, 45, 0, Math.PI * 2);
                ctx.fill();
            }

            function drawVibrantRibbon(color, width, x1, y1, cp1x, cp1y, cp2x, cp2y, x2, y2) {
                ctx.strokeStyle = color;
                ctx.lineWidth = width;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
                ctx.stroke();
            }

            drawVibrantRibbon('#e11d48', 28, 100, 200, 400, 100, 600, 800, 900, 400);
            drawVibrantRibbon('#2563eb', 24, 50, 600, 300, 900, 700, 200, 950, 700);
            drawVibrantRibbon('#f59e0b', 22, 200, 50, 500, 500, 500, 500, 800, 950);
            drawVibrantRibbon('#7c3aed', 20, 300, 900, 600, 400, 400, 600, 700, 100);
            drawVibrantRibbon('#d4af37', 18, 50, 400, 500, 100, 500, 900, 900, 600);

            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.moveTo(512, 200); ctx.lineTo(560, 300); ctx.lineTo(464, 300);
            ctx.fill();

            const texture = new THREE.CanvasTexture(canvas);
            const geometry = new THREE.IcosahedronGeometry(1, 3);
            const material = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.25,
                metalness: 0.15
            });

            ballMesh = new THREE.Mesh(geometry, material);
            scene.add(ballMesh);

            function animate() {
                requestAnimationFrame(animate);
                if (ballMesh) {
                    ballMesh.rotation.y += 0.009;
                    ballMesh.rotation.x += 0.004;
                }
                renderer.render(scene, camera);
            }
            animate();
        }

        // --- عرض المباريات والبطاقات فوراً ---
        function renderApp() {
            renderMatches();
            renderWheel();
        }

        function renderMatches() {
            const leftCol = document.getElementById('left-matches');
            const rightCol = document.getElementById('right-matches');
            if(!leftCol || !rightCol) return;

            leftCol.innerHTML = '';
            rightCol.innerHTML = '';

            state.matches.forEach((m, idx) => {
                const card = document.createElement('div');
                card.className = `match-card`;
                const statusText = !m.team1 && !m.team2 ? 'في انتظار السحب...' : 
                                   (m.team1 && m.team2 ? 'مكتملة ✅' : 'في انتظار الطرف الثاني...');

                card.innerHTML = `
                    <div class="match-title">مباراة ${m.id}</div>
                    <div class="match-teams">
                        <div class="team-box ${!m.team1 ? 'empty' : ''}">${m.team1 || '?'}</div>
                        <div class="vs-badge">ضد</div>
                        <div class="team-box ${!m.team2 ? 'empty' : ''}">${m.team2 || '?'}</div>
                    </div>
                    <div class="match-status">${statusText}</div>
                `;

                if (idx < 4) rightCol.appendChild(card);
                else leftCol.appendChild(card);
            });
        }

        function renderWheel() {
            const container = document.getElementById('wheel-cards-container');
            const wheelBox = document.querySelector('.wheel-center-container');
            if(!container || !wheelBox) return;

            container.innerHTML = '';
            
            // احتساب قطر العجلة متجاوباً مع حجم الشاشة
            const containerWidth = wheelBox.clientWidth || 350;
            const radius = containerWidth * 0.36;
            const total = 16;

            for (let i = 0; i < total; i++) {
                const angle = (i * (360 / total)) * (Math.PI / 180);
                const x = radius * Math.cos(angle);
                const y = radius * Math.sin(angle);

                const slot = document.createElement('div');
                slot.className = `wheel-card-slot ${state.drawnSlots[i] ? 'drawn' : ''}`;
                slot.style.transform = `translate(${x}px, ${y}px)`;
                slot.onclick = () => handleCardClick(i);

                slot.innerHTML = `<div class="card-inner">؟</div>`;
                container.appendChild(slot);
            }
        }

        function handleCardClick(slotIndex) {
            if (state.drawnSlots[slotIndex] || state.availableTeams.length === 0) return;

            if (ballMesh) {
                ballMesh.rotation.y += 3.5;
                ballMesh.rotation.x += 1.8;
            }

            const randomTeamIndex = Math.floor(Math.random() * state.availableTeams.length);
            const selectedTeam = state.availableTeams.splice(randomTeamIndex, 1)[0];
            state.drawnSlots[slotIndex] = true;

            let targetMatch = state.matches.find(m => !m.team1 || !m.team2);
            let slotPosition = '';
            if (targetMatch) {
                if (!targetMatch.team1) {
                    targetMatch.team1 = selectedTeam;
                    slotPosition = 'طرف أول';
                } else {
                    targetMatch.team2 = selectedTeam;
                    slotPosition = 'طرف ثاني';
                }
            }

            showRevealModal(selectedTeam, `مباراة ${targetMatch.id} (${slotPosition})`);
            saveState(state);

            if (targetMatch.team1 && targetMatch.team2) {
                setTimeout(() => {
                    confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
                }, 400);
            }
        }

        function drawRandomCard() {
            const undrawn = state.drawnSlots.map((d, idx) => d ? null : idx).filter(v => v !== null);
            if (undrawn.length === 0) return;
            const randomIdx = undrawn[Math.floor(Math.random() * undrawn.length)];
            handleCardClick(randomIdx);
        }

        function showRevealModal(teamName, destText) {
            const modal = document.getElementById('reveal-modal');
            document.getElementById('modal-team-name').innerText = teamName;
            document.getElementById('modal-dest-text').innerText = `يتجه إلى ${destText}`;
            modal.classList.add('active');
            setTimeout(() => modal.classList.remove('active'), 1500);
        }

        function resetDraw() {
            if (!confirm("هل أنت متأكد من إعادة إجراء القرعة بالكامل؟")) return;
            const newState = {
                matches: Array.from({ length: 8 }, (_, i) => ({ id: i + 1, team1: null, team2: null })),
                drawnSlots: new Array(16).fill(false),
                availableTeams: [...INITIAL_TEAMS]
            };
            saveState(newState);
        }

        window.addEventListener('resize', renderWheel);

        window.onload = () => {
            renderApp();
            init3DBall();
            fetchCloudState();
            setInterval(fetchCloudState, 2500);
        };
    </script>
</body>
</html>
